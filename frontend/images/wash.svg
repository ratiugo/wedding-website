<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="320" viewBox="0 0 1600 320" preserveAspectRatio="none">
  <!-- A grey ink wash bleeding into the paper, fading out at the top and bottom edges:
       a soft pale wash, with darker pools that have crisp, feathered edges on top. -->
  <defs>
    <filter id="wash" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.009" numOctaves="3" seed="4" />
      <feColorMatrix type="matrix"
        values="0 0 0 0 0.45
                0 0 0 0 0.44
                0 0 0 0 0.42
                3 0 0 0 -1.25" />
    </filter>
    <filter id="pools" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="6" seed="11" result="noise" />
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="2" seed="2" result="grain" />
      <feDisplacementMap in="noise" in2="grain" scale="18" xChannelSelector="R" yChannelSelector="G" result="bled" />
      <feColorMatrix in="bled" type="matrix"
        values="0 0 0 0 0.3
                0 0 0 0 0.29
                0 0 0 0 0.28
                6 0 0 0 -3.1" />
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.3" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.7" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="edges">
      <rect width="1600" height="320" fill="url(#fade)" />
    </mask>
  </defs>
  <g mask="url(#edges)">
    <rect width="1600" height="320" filter="url(#wash)" />
    <rect width="1600" height="320" filter="url(#pools)" opacity="0.8" />
  </g>
</svg>
