services:
  rsvp:
    build:
      context: .
      dockerfile: rsvp/Dockerfile
      target: runtime
    ports:
      - "9000:8080"
    environment:
      INVITATIONS_TABLE: wedding-invitations
      RSVP_BUCKET: wedding-rsvps
      RSVP_OPEN: "true"
      AWS_ENDPOINT_URL: http://aws:5000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      aws:
        condition: service_healthy

  # `make start`: create the local bucket and table, with the example invitations
  # (scripts/local_aws.py).
  local-aws:
    profiles: [tools]
    build:
      context: .
      dockerfile: notifier/Dockerfile
      target: runtime
    entrypoint: ["python", "/scripts/local_aws.py"]
    environment:
      INVITATIONS_TABLE: wedding-invitations
      RSVP_BUCKET: wedding-rsvps
      AWS_ENDPOINT_URL: http://aws:5000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      PYTHONPATH: /var/task
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    depends_on:
      aws:
        condition: service_healthy

  # `make sheet-setup`: create the Google Sheet's tabs (scripts/setup_sheet.py).
  sheet-setup:
    profiles: [tools]
    build:
      context: .
      dockerfile: notifier/Dockerfile
      target: runtime
    entrypoint: ["python", "/scripts/setup_sheet.py"]
    environment:
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_KEY_FILE: /secrets/google-key.json
      PYTHONPATH: /var/task
    volumes:
      - ./scripts:/scripts:ro
      - ${GOOGLE_KEY_PATH:-/dev/null}:/secrets/google-key.json:ro

  # `make load-guests`: load the planning workbook's Invite list into dev's or prod's
  # invitations table (scripts/load_guests.py).
  load-guests:
    profiles: [tools]
    build:
      context: .
      dockerfile: notifier/Dockerfile
      target: runtime
    entrypoint: ["python", "/scripts/load_guests.py"]
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_DEFAULT_REGION: us-west-2
      HOME: /root
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_KEY_FILE: /secrets/google-key.json
      PYTHONPATH: /var/task
    volumes:
      - ./scripts:/scripts:ro
      - ${GOOGLE_KEY_PATH:-/dev/null}:/secrets/google-key.json:ro
      - ~/.aws:/root/.aws

  # `make send-update`: scripts/send_update.py against real AWS, using your AWS profile.
  send-update:
    profiles: [tools]
    build:
      context: .
      dockerfile: notifier/Dockerfile
      target: runtime
    entrypoint: ["python", "/scripts/send_update.py"]
    environment:
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_DEFAULT_REGION: us-west-2
      HOME: /root
      PYTHONPATH: /var/task
    volumes:
      - ./scripts:/scripts:ro
      - ../updates:/updates
      - ~/.aws:/root/.aws

  # Fake AWS (moto server) for S3 and DynamoDB, in memory: `make start` recreates the
  # bucket and table each time this container is created.
  aws:
    image: motoserver/moto:5.2.4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      retries: 15

  # `make test`. Only runs on demand (profile), never with `up`.
  rsvp-test:
    profiles: [test]
    build:
      context: .
      dockerfile: rsvp/Dockerfile
      target: test
    command: ["rsvp/tests", "scripts/tests"]
    environment:
      # The tests mock AWS; boto3 still needs a region and table name to set up.
      AWS_DEFAULT_REGION: us-east-1
      INVITATIONS_TABLE: wedding-invitations
      # scripts/send_update.py requires these; its tests set their own values.
      SITE_URL: https://example.com
      SENDER: Us <hello@example.com>
      REPLY_TO: us@example.com
      PYTHONPATH: /backend/rsvp:/backend/scripts:/backend/notifier:/backend/shared:/var/task
    volumes:
      - ./:/backend

  notifier-test:
    profiles: [test]
    build:
      context: .
      dockerfile: notifier/Dockerfile
      target: test
    command: ["notifier/tests"]
    environment:
      SENDER_NAME: Wedding RSVPs
      SENDER_EMAIL: rsvp@example.com
      RECIPIENT_EMAILS: colton@example.com,tess@example.com
      GUEST_SENDER: Us <hello@example.com>
      REPLY_TO: us@example.com
      SITE_URL: https://example.com
      INVITATIONS_TABLE: wedding-invitations
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./:/backend
