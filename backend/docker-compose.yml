services:
  rsvp:
    build:
      context: ./rsvp
      target: runtime
    ports:
      - "9000:8080"
    environment:
      INVITATIONS_TABLE: wedding-invitations
      RSVP_BUCKET: wedding-rsvps
      RSVP_OPEN: "true"
      # boto3 sends every AWS call to the local fake AWS instead.
      AWS_ENDPOINT_URL: http://aws:5000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      # For `make start`, which runs scripts/local_aws.py here.
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    depends_on:
      aws:
        condition: service_healthy

  # `make sheet-setup`: create the Google Sheet's tabs (scripts/setup_sheet.py).
  sheet-setup:
    profiles: [tools]
    build:
      context: ./notifier
      target: runtime
    entrypoint: ["python", "/scripts/setup_sheet.py"]
    environment:
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      GOOGLE_KEY_FILE: /secrets/google-key.json
      # Lets the script import sheets.py and gspread from the image.
      PYTHONPATH: /var/task
    volumes:
      - ./scripts:/scripts:ro
      # /dev/null when backend/.env doesn't set the key's path (as in CI), so the file still loads.
      - ${GOOGLE_KEY_PATH:-/dev/null}:/secrets/google-key.json:ro

  # Fake AWS (moto server) for S3 and DynamoDB, in memory: `make start` recreates the
  # bucket and table each time this container is created.
  aws:
    image: motoserver/moto:5.2.4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      retries: 15

  # `make test`. Only runs on demand (profile), never with `up`.
  rsvp-test:
    profiles: [test]
    build:
      context: ./rsvp
      target: test
    command: ["rsvp/tests"]
    environment:
      # The tests mock AWS; boto3 still needs a region and table name to set up.
      AWS_DEFAULT_REGION: us-east-1
      INVITATIONS_TABLE: wedding-invitations
    volumes:
      - ./:/backend

  notifier-test:
    profiles: [test]
    build:
      context: ./notifier
      target: test
    command: ["notifier/tests"]
    environment:
      SENDER_NAME: Wedding RSVPs
      SENDER_EMAIL: rsvp@example.com
      RECIPIENT_EMAILS: colton@example.com,tess@example.com
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./:/backend

