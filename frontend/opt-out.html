<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wedding updates · Tess &amp; Colton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/save-the-date.css">
</head>
<body>
  <!-- Reached from the link in each update email, /opt-out?invite_code=... -->
  <main class="card">
    <p class="eyebrow">Wedding updates</p>

    <!-- Nothing changes until they press the button, since email apps open links to scan them -->
    <section id="ask">
      <h1 class="title">Stop getting updates?</h1>
      <p class="message">We'll stop emailing you updates about the wedding. Everything will still be here on the website.</p>
      <button type="button" class="card-button" id="opt-out-button">Stop updates</button>
      <p class="error" id="error" hidden></p>
    </section>

    <section id="done" hidden>
      <h1 class="title">You're opted out</h1>
      <p class="message">We won't send you any more updates. Changed your mind? Reply to any of our emails and we'll add you back.</p>
    </section>
  </main>

  <script src="js/opt-out.js"></script>
</body>
</html>
