<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Wedding updates · Tess &amp; Colton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@50..200,200..400&family=Poppins:wght@200;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Reached from the link in each update email, /opt-out?invite_code=... -->
  <main class="section opt-out">
    <p class="hero-eyebrow">Tess + Colton</p>

    <!-- Nothing changes until they press the button, since email apps open links to scan them -->
    <section id="ask">
      <h2>Stop getting updates?</h2>
      <p>We'll stop emailing you updates about the wedding. Everything will still be here on the website.</p>
      <button type="button" class="button" id="opt-out-button">Stop updates</button>
      <p class="error" id="error" hidden></p>
    </section>

    <section id="done" hidden>
      <h2>You're opted out</h2>
      <p>We won't send you any more updates. Changed your mind? Reply to any of our emails and we'll add you back.</p>
    </section>
  </main>

  <script src="js/opt-out.js"></script>
</body>
</html>
