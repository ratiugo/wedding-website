<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP &middot; Tess &amp; Colton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wdth,wght@50..200,200..400&family=Poppins:wght@200;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-bar">
    <a class="bar-name" href="/">Tess + Colton</a>
    <button class="menu-button" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <span></span><span></span>
    </button>
  </header>
  <nav class="menu" id="menu" hidden>
    <a href="/#wedding">Wedding</a>
    <a href="/#travel">Travel</a>
    <a href="/#weekend">Weekend</a>
    <a href="/#registry">Registry</a>
    <a href="/#faq">FAQ</a>
    <a href="/rsvp">RSVP</a>
  </nav>

  <main class="section rsvp">
    <h2>RSVP</h2>

    <!-- Step 1: find the invitation (skipped when the link has ?invite_code=...) -->
    <form id="lookup-form">
      <label for="invite-code">Enter the code from your invitation</label>
      <!-- One real input, invisible over eight boxes that show what's typed in it -->
      <div class="code-entry">
        <input id="invite-code" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        <div class="code-slots" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <i class="code-dash"></i>
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <p class="error" id="lookup-error" hidden></p>
      <button type="submit" class="button">Find my invitation</button>
    </form>

    <!-- Step 2: answer for each guest -->
    <form id="rsvp-form" hidden>
      <p class="greeting">Hello, <span id="invite-label"></span>!</p>
      <div id="guest-list"></div>

      <label for="notes">Anything else we should know? <span class="optional">(optional)</span></label>
      <textarea id="notes" rows="3" maxlength="500"></textarea>

      <div class="choices">
        <label><input type="checkbox" id="updates-opt-out"> Opt out of email updates about the wedding</label>
      </div>

      <p class="error" id="rsvp-error" hidden></p>
      <button type="submit" class="button">Send RSVP</button>
    </form>

    <!-- Step 3: confirmation -->
    <div id="thanks" hidden>
      <p class="greeting" id="thanks-message"></p>
      <button type="button" class="button button-secondary" id="edit-button">Change my response</button>
    </div>
  </main>

  <!-- One of these is cloned per guest on the invitation -->
  <template id="guest-template">
    <fieldset class="guest">
      <legend class="guest-name"></legend>
      <label class="plus-one-name" hidden>
        Guest's name
        <input type="text" name="name" maxlength="100">
      </label>
      <div class="choices">
        <label><input type="radio" value="yes" required> Joyfully accepts</label>
        <label><input type="radio" value="no"> Regretfully declines</label>
      </div>
      <label class="dietary" hidden>
        Dietary restrictions or allergies <span class="optional">(optional)</span>
        <input type="text" name="dietary" maxlength="500">
      </label>
    </fieldset>
  </template>

  <script src="js/menu.js"></script>
  <script src="js/rsvp.js"></script>
</body>
</html>
