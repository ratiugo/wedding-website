# Run the backend tests and linters on every pull request, with the same `make` commands
# used locally. Pushes to main run this through deploy.yml, before deploying.
name: CI

on:
  pull_request:
  workflow_call:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - run: make lint
