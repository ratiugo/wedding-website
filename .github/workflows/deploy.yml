# On every push to main: deploy to dev, then wait for approval before deploying the
# same commit to prod. The steps are in deploy-environment.yml.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  dev:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev

  prod:
    needs: dev
    concurrency: prod
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
