# Deploys one environment: the Lambdas (rsvp, notifier), then the site, so a new page
# never calls an old API. Called by deploy.yml.
#
# dev builds the Lambda images for this commit. prod never builds: it deploys the images
# dev built and tested, tagged release-<sha> so ECR's lifecycle rule keeps them.
name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod. The GitHub environment of the same name holds its variables and approval rule.
        required: true
        type: string

jobs:
  deploy:
    # Arm, matching the Lambdas' architecture, so the images build natively.
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.environment }}
    env:
      COMMIT: ${{ github.sha }}
      # The image tag each environment deploys.
      TAG: ${{ inputs.environment == 'prod' && format('release-{0}', github.sha) || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags can't be overwritten, so a re-run of this commit reuses its images.
      - name: Build and push the Lambda images
        if: inputs.environment == 'dev'
        run: |
          for lambda in rsvp notifier; do
            image="${{ steps.ecr.outputs.registry }}/wedding/$lambda:$COMMIT"
            if aws ecr describe-images --repository-name "wedding/$lambda" --image-ids "imageTag=$COMMIT" > /dev/null 2>&1; then
              echo "$image already exists"
            else
              docker build --provenance=false --target runtime -t "$image" "backend/$lambda"
              docker push "$image"
            fi
          done

      # Checks both images exist before tagging either, so a missing one fails cleanly.
      - name: Tag dev's Lambda images as releases
        if: inputs.environment == 'prod'
        run: |
          image() {
            aws ecr batch-get-image --repository-name "wedding/$1" \
              --image-ids "imageTag=$COMMIT" --query "images[0].$2" --output text
          }
          for lambda in rsvp notifier; do
            if [ "$(image "$lambda" imageManifest)" = "None" ]; then
              echo "::error::No wedding/$lambda:$COMMIT in ECR. Dev must build this commit first."
              exit 1
            fi
          done
          for lambda in rsvp notifier; do
            if aws ecr describe-images --repository-name "wedding/$lambda" --image-ids "imageTag=$TAG" > /dev/null 2>&1; then
              echo "wedding/$lambda:$TAG already exists"
              continue
            fi
            aws ecr put-image --repository-name "wedding/$lambda" --image-tag "$TAG" \
              --image-manifest "$(image "$lambda" imageManifest)" \
              --image-manifest-media-type "$(image "$lambda" imageManifestMediaType)" > /dev/null
          done

      - name: Deploy the Lambdas
        run: |
          deploy() {
            aws lambda update-function-code --function-name "$1" \
              --image-uri "${{ steps.ecr.outputs.registry }}/wedding/$2:$TAG" > /dev/null
            aws lambda wait function-updated-v2 --function-name "$1"
          }
          deploy "${{ vars.RSVP_FUNCTION }}" rsvp
          deploy "${{ vars.NOTIFIER_FUNCTION }}" notifier

      - run: aws s3 sync frontend/ "s3://${{ vars.SITE_BUCKET }}" --delete
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths "/*"
