# Run the backend tests and linters on every pull request, with the same `make` commands
# used locally. The main branch's ruleset requires this to pass before merging.
name: CI

on:
  pull_request:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - run: make lint
